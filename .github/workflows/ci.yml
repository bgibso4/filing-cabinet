name: CI

on:
  pull_request:
    # ready_for_review: marking a draft ready starts the simulator jobs (see plan).
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # The plan job asks whether a pull request already passed the gate on the same files (scripts/ci/gate-passed.sh).
  actions: read

jobs:
  # Which jobs to run. checks always runs. The gate (snapshots in two jobs, and the smoke set with the package tests;
  # about 14 min) runs on a PR once it is ready for review, unless the PR changes only docs/, site/ and Markdown, and
  # on main unless a PR already passed it on exactly the same files (scripts/ci/gate-passed.sh). While a PR is a
  # draft, run the touched tests locally: make affected. Every other journey and the audits run nightly (nightly.yml).
  # design/ is code: design/tokens.json generates the tokens.
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          sim=true
          if [ "$EVENT" = pull_request ]; then
            if [ "$DRAFT" = true ]; then
              sim=false; echo "Draft PR: checks only."
            elif scripts/docs-only.sh "$BASE...$HEAD"; then
              sim=false; echo "Only docs/, site/ and Markdown changed: checks only."
            fi
          elif passed="$(scripts/ci/gate-passed.sh "$GITHUB_SHA")"; then
            sim=false; echo "Same files as $passed, which passed the gate: checks only."
          fi
          jobs='[{"job":"checks","target":"ci-checks"}]'
          if [ "$sim" = true ]; then
            jobs='[{"job":"checks","target":"ci-checks"},
              {"job":"snapshots-1","target":"ci-sim SHARD=snapshots-1"},
              {"job":"snapshots-2","target":"ci-sim SHARD=snapshots-2"},
              {"job":"smoke","target":"ci-sim SHARD=smoke"}]'
          fi
          echo "matrix=$(jq -c '{include: .}' <<< "$jobs")" >> "$GITHUB_OUTPUT"

  ci:
    # The parts of the gate, side by side (the Makefile's shards).
    needs: plan
    name: ${{ matrix.job }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    # Xcode 27 image (actions/runner-images, macOS 27, iOS 27.0 simulators incl. iPhone 17).
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      CODE_SIGNING_ALLOWED: "NO"
      # The image's simulator. Locally the Makefile defaults to this project's own `FC iPhone 17`.
      SIM_DEVICE: iPhone 17
      # swift-snapshot-testing writes failed/diff images here (xcodebuild forwards TEST_RUNNER_ vars to the tests).
      TEST_RUNNER_SNAPSHOT_ARTIFACTS: ${{ github.workspace }}/.build/snapshot-artifacts
    steps:
      - uses: actions/checkout@v7
        with:
          # changed-snapshots.sh diffs against origin/main.
          fetch-depth: 0

      - uses: ./.github/actions/xcode-setup
        with:
          job: ${{ matrix.job }}

      - name: make ${{ matrix.target }}
        run: make ${{ matrix.target }}

      - name: Upload snapshot failures
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failures-${{ matrix.job }}
          if-no-files-found: ignore
          path: |
            .build/snapshot-artifacts
            .build/DerivedData/Logs/Test/*.xcresult

      # Where the time goes: xcodebuild's stamped output (Makefile STAMP), Xcode's build log (per target and file) and
      # the test results (per test and step).
      - name: Upload timing evidence
        if: always() && matrix.job != 'checks'
        uses: actions/upload-artifact@v7
        with:
          name: timing-${{ matrix.job }}
          if-no-files-found: ignore
          path: |
            .build/xcodebuild.log
            .build/boot.log
            .build/DerivedData/Logs/Build/*.xcactivitylog
            .build/DerivedData/Logs/Test/*.xcresult
