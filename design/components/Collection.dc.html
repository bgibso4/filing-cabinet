<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Collection</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: {{c.bg}}; color: {{c.tx}}; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; font-variant-numeric: tabular-nums;">

  <div style="height: 844px; box-sizing: border-box; overflow-y: auto; scrollbar-width: none; display: flex; flex-direction: column; justify-content: {{justify}}; padding: {{pad}};">

    <sc-if value="{{atTop}}" hint-placeholder-val="{{ true }}">
      <div style="display: flex; flex-direction: column; flex: none;">
        <div style="display: flex; align-items: center; justify-content: space-between; height: 44px;">
          <button type="button" aria-label="Back" style="width: 44px; height: 44px; padding: 0; border-radius: 999px; display: flex; align-items: center; justify-content: center; background: {{c.glass}}; border: 0.5px solid {{c.glassEdge}}; -webkit-backdrop-filter: blur(20px) saturate(1.6); backdrop-filter: blur(20px) saturate(1.6); color: {{c.tx}}; cursor: pointer;"><svg width="11" height="18" viewBox="0 0 11 18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 2L2 9l7 7"></path></svg></button>
          <button type="button" aria-label="Sort" style="width: 44px; height: 44px; padding: 0; border-radius: 999px; display: flex; align-items: center; justify-content: center; background: {{c.glass}}; border: 0.5px solid {{c.glassEdge}}; -webkit-backdrop-filter: blur(20px) saturate(1.6); backdrop-filter: blur(20px) saturate(1.6); color: {{c.tx}}; cursor: pointer;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4v16M3 8l4-4 4 4M17 20V4M13 16l4 4 4-4"></path></svg></button>
        </div>
        <div style="display: flex; align-items: center; gap: 10px; margin-top: 8px;">
          <sc-if value="{{isFolder}}" hint-placeholder-val="{{ true }}"><span aria-hidden="true" style="flex: none; width: 34px; height: 34px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; background: {{collBadge}};"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="{{collGlyph}}"></path></svg></span></sc-if>
          <sc-if value="{{isView}}" hint-placeholder-val="{{ false }}"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="{{c.tx2}}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none;"><path d="{{viewIcon}}"></path></svg></sc-if>
          <h1 style="margin: 0; font-family: ui-serif, 'New York', 'Iowan Old Style', Georgia, serif; font-size: 28px; line-height: 34px; font-weight: 700;">{{title}}</h1>
        </div>
        <p style="margin: 2px 0 0; font-size: 15px; line-height: 20px; color: {{c.tx2}};">{{subtitle}}</p>
      </div>
    </sc-if>

    <sc-if value="{{isEmpty}}" hint-placeholder-val="{{ false }}">
      <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 0 24px 90px; text-align: center;">
        <span aria-hidden="true" style=" width: 77px; height: 77px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; background: {{collBadge}};"><svg width="43" height="43" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="{{collGlyph}}"></path></svg></span>
        <span style="font-size: 17px; line-height: 22px; font-weight: 600;">{{emptyTitle}}</span>
        <span style="max-width: 280px; font-size: 15px; line-height: 20px; color: {{c.tx2}}; text-wrap: pretty;">{{emptyBody}}</span>
      </div>
    </sc-if>

    <sc-if value="{{isSoon}}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; flex-direction: column; flex: none;">
        <h2 style="display: flex; align-items: center; min-height: 44px; margin: 10px 0 2px; font-family: ui-serif, 'New York', 'Iowan Old Style', Georgia, serif; font-size: 22px; line-height: 28px; font-weight: 700;">Leaving this week</h2>
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px 8px;">
          <sc-for list="{{soon}}" as="s" hint-placeholder-count="3">
            <a href="#" style="display: flex; flex-direction: column; gap: 2px; min-width: 0; color: {{c.tx}}; text-decoration: none;">
              <img src="{{s.img}}" alt="" style="display: block; width: 100%; aspect-ratio: 3 / 4; border-radius: 6px; object-fit: cover; object-position: top; background: {{c.ground}};">
              <span style="margin-top: 4px; font-size: 13px; line-height: 18px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{s.title}}</span>
              <span style="font-size: 12px; line-height: 16px; color: {{s.leftColor}}; font-weight: {{s.leftWeight}};">{{s.left}}</span>
            </a>
          </sc-for>
        </div>
        <h2 style="display: flex; align-items: center; min-height: 44px; margin: 18px 0 2px; font-family: ui-serif, 'New York', 'Iowan Old Style', Georgia, serif; font-size: 22px; line-height: 28px; font-weight: 700;">All receipts</h2>
      </div>
    </sc-if>

    <sc-if value="{{isGrid}}" hint-placeholder-val="{{ true }}">
      <div style="display: grid; grid-template-columns: {{cols}}; gap: 16px 8px; flex: none; margin-top: {{gridTop}};">

          <a href="#" style="display: flex; flex-direction: column; gap: 2px; min-width: 0; color: {{c.tx}}; text-decoration: none;">
            <span style="position: relative; display: block; width: 100%; aspect-ratio: {{aspect}}; box-sizing: border-box; border-radius: 6px; overflow: hidden; border: {{s.slot}}; background: {{s.ground}};">
              <img src="{{s.img}}" alt="" style="display: {{s.imgDisplay}}; width: 100%; height: 100%; object-fit: {{s.fit}}; object-position: {{s.pos}};">
              <span role="img" aria-label="{{s.markLabel}}" style="position: absolute; right: 5px; top: 5px; width: 26px; height: 26px; border-radius: 999px; display: {{s.markDisplay}}; align-items: center; justify-content: center; background: rgba(28,28,30,0.55);"><svg width="15" height="15" viewBox="0 0 24 24" fill="{{s.markFill}}" stroke="{{markColor}}" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="{{markPath}}"></path></svg></span>
            </span>
            <span style="display: {{s.textDisplay}}; align-items: center; gap: 5px; min-width: 0; margin-top: 4px;">
              <span style="display: {{s.dotDisplay}}; flex: none; width: 7px; height: 7px; border-radius: 999px; background: {{s.dot}};"></span>
              <span style="min-width: 0; font-size: 13px; line-height: 18px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{s.title}}</span>
            </span>
            <span style="display: {{s.textDisplay}}; font-size: 12px; line-height: 16px; color: {{s.leftColor}}; font-weight: {{s.leftWeight}};">{{s.left}}</span>
          </a>
        </sc-for>
      </div>
    </sc-if>

    <!-- Custom order: the tile being dragged, lifted over an empty slot -->
    <sc-if value="{{dragging}}" hint-placeholder-val="{{ false }}">
      <span style="position: absolute; left: 150px; top: 196px; width: 114px; display: flex; flex-direction: column; gap: 2px; transform: scale(1.08); pointer-events: none;">
        <span style="position: relative; display: block; width: 114px; height: 152px; border-radius: 6px; overflow: hidden; border: 0.5px solid {{c.glassEdge}}; background: {{c.ground}};">
          <img src="{{drag.img}}" alt="" style="display: block; width: 100%; height: 100%; object-fit: {{drag.fit}}; object-position: {{drag.pos}};">
          <span style="position: absolute; right: 5px; top: 5px; width: 26px; height: 26px; border-radius: 999px; display: flex; align-items: center; justify-content: center; background: rgba(28,28,30,0.55);"><svg width="15" height="15" viewBox="0 0 24 24" fill="{{markColor}}" stroke="{{markColor}}" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="{{markPath}}"></path></svg></span>
        </span>
        <span style="display: flex; align-items: center; gap: 5px; margin-top: 4px;"><span style="flex: none; width: 7px; height: 7px; border-radius: 999px; background: {{drag.dot}};"></span><span style="font-size: 13px; line-height: 18px; font-weight: 600; white-space: nowrap;">{{drag.title}}</span></span>
      </span>
    </sc-if>

    <sc-if value="{{isList}}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; flex-direction: column; flex: none; margin-top: {{listTop}}; background: {{c.surface}}; border-radius: 14px; overflow: hidden;">

          <a href="#" style="display: flex; align-items: center; gap: 12px; min-height: 76px; padding: 0 16px; color: {{c.tx}}; text-decoration: none;">

            <span style="flex: 1; min-width: 0; align-self: stretch; display: flex; align-items: center; gap: 12px; border-top: {{s.line}};">
              <span style="flex: 1; min-width: 0; display: flex; flex-direction: column;">
                <span style="font-size: 17px; line-height: 22px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{s.title}}</span>
                <span style="font-size: 15px; line-height: 20px; color: {{c.tx2}};">{{s.date}} · <span style="color: {{s.leftColor}}; font-weight: {{s.leftWeight}};">{{s.left}}</span></span>
              </span>
              <svg width="8" height="13" viewBox="0 0 8 13" fill="none" stroke="{{c.chev}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none;"><path d="M1.5 1.5l5 5-5 5"></path></svg>
            </span>
          </a>
        </sc-for>
      </div>
    </sc-if>

  </div>

  <sc-if value="{{atEnd}}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; left: 0; right: 0; top: 0; height: 150px; pointer-events: none; background: linear-gradient(to bottom, {{c.bg}} 68%, {{c.bgClear}});"></div>

        </span>

    </div>
  </sc-if>

  <sc-if value="{{toast}}" hint-placeholder-val="{{ false }}">
    <div role="status" style="position: absolute; left: 16px; right: 16px; bottom: 96px; display: flex; justify-content: center;">
      <span style="display: flex; align-items: center; gap: 14px; min-height: 48px; padding: 0 6px 0 18px; border-radius: 999px; background: {{c.glassStrong}}; border: 0.5px solid {{c.glassEdge}}; -webkit-backdrop-filter: blur(20px) saturate(1.6); backdrop-filter: blur(20px) saturate(1.6); font-size: 15px; line-height: 20px; white-space: nowrap;">
        <span><span style="font-weight: 600;">Moved to Trash</span><span style="color: {{c.tx2}};"> · restore within 30 days</span></span>
        <button type="button" style="min-height: 44px; padding: 0 14px; border: 0; border-radius: 999px; background: transparent; color: {{c.tx}}; font-family: inherit; font-size: 15px; line-height: 20px; font-weight: 600; cursor: pointer;">Undo</button>
      </span>
    </div>
  </sc-if>

  <div style="position: absolute; left: 16px; right: 16px; bottom: 28px; display: flex; justify-content: center;">
    <button type="button" style="display: flex; align-items: center; gap: 8px; min-height: 52px; padding: 0 30px; border: 0; border-radius: 999px; background: {{c.tx}}; color: {{c.bg}}; font-family: inherit; font-size: 17px; line-height: 22px; font-weight: 600; cursor: pointer;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none;"><path d="M4 8V5.5A1.5 1.5 0 0 1 5.5 4H8M16 4h2.5A1.5 1.5 0 0 1 20 5.5V8M20 16v2.5a1.5 1.5 0 0 1-1.5 1.5H16M8 20H5.5A1.5 1.5 0 0 1 4 18.5V16"></path><path d="M9 9.5h6M9 12.5h6M9 15.5h3.5"></path></svg>
      <span>{{scanLabel}}</span>
    </button>
  </div>

</div>
</x-dc>
