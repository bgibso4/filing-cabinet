<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Notifications</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<!-- A lock screen, drawn by iOS. Only the words in the notification are ours. -->
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: linear-gradient(160deg, #3d4a5c 0%, #1f2733 55%, #12161d 100%); color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased;">
  <div style="position: absolute; left: 0; right: 0; top: 70px; display: flex; flex-direction: column; align-items: center;">
    <span style="font-size: 20px; line-height: 26px; font-weight: 600; opacity: 0.9;">Saturday, October 24</span>
    <span style="font-size: 92px; line-height: 96px; font-weight: 700; letter-spacing: -2px; opacity: 0.95;">9:01</span>
  </div>

  <div style="position: absolute; left: 12px; right: 12px; top: 300px; display: flex; flex-direction: column; gap: 8px;">
    <sc-for list="{{notes}}" as="n" hint-placeholder-count="1">
      <div style="display: flex; gap: 12px; padding: 14px 16px; border-radius: 24px; background: rgba(245,245,247,0.78); -webkit-backdrop-filter: blur(30px) saturate(1.6); backdrop-filter: blur(30px) saturate(1.6); color: #1c1c1e;">
        <span style="flex: none; width: 38px; height: 38px; border-radius: 9px; display: flex; align-items: center; justify-content: center; background: #1c1c1e;"><svg width="22" height="17" viewBox="0 0 28 22" fill="#f2f2f7" aria-hidden="true"><path d="M0 3a3 3 0 0 1 3-3h6.3a3 3 0 0 1 2.2 1l1.3 1.5H25a3 3 0 0 1 3 3V19a3 3 0 0 1-3 3H3a3 3 0 0 1-3-3z"></path></svg></span>
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column;">
          <span style="display: flex; justify-content: space-between; gap: 8px;"><b style="font-size: 15px; line-height: 20px;">{{n.title}}</b><span style="flex: none; font-size: 13px; line-height: 20px; color: #6e6e73;">{{n.when}}</span></span>
          <span style="font-size: 15px; line-height: 20px;">{{n.body}}</span>
        </span>
      </div>
    </sc-for>
  </div>

  <div style="position: absolute; left: 24px; right: 24px; bottom: 120px; text-align: center; font-size: 13px; line-height: 18px; color: rgba(255,255,255,0.75);">{{caption}}</div>
  <div style="position: absolute; left: 50%; bottom: 10px; width: 134px; height: 5px; margin-left: -67px; border-radius: 999px; background: rgba(255,255,255,0.8);"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"kind":{"editor":"enum","options":["after","before"],"default":"after"},"count":{"editor":"enum","options":["one","few","many","mixed"],"default":"few"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var kind = this.props.kind ?? 'after';
    var count = this.props.count ?? 'few';
    var N = {
      after: {
        one: ['Cleaned up', 'Moved the City Pharmacy receipt to Trash. It’s there for 30 days if you need it.'],
        few: ['Cleaned up 3 receipts', 'City Pharmacy, Bluebird Café and Corner Market moved to Trash. They’re there for 30 days if you need them.'],
        mixed: ['Cleaned up 3 scans', 'Parking stub, Coat check and City Pharmacy moved to Trash. They’re there for 30 days if you need them.'],
        many: ['Cleaned up 8 scans', 'Expired scans moved to Trash. They’re there for 30 days if you need one back.']
      },
      before: {
        one: ['Leaving tomorrow', 'The City Pharmacy receipt goes to Trash tomorrow. Open it to keep it longer.'],
        few: ['3 receipts leave tomorrow', 'City Pharmacy, Bluebird Café and Corner Market go to Trash tomorrow.'],
        mixed: ['3 scans leave tomorrow', 'Parking stub, Coat check and City Pharmacy go to Trash tomorrow.'],
        many: ['8 scans leave tomorrow', 'They go to Trash tomorrow. Open Filing Cabinet to keep any you still need.']
      }
    }[kind][count];
    var caption = {
      one: 'One scan: named',
      few: 'Up to 3, all one collection: named',
      mixed: 'Up to 3, mixed collections: named, called scans',
      many: '4 or more: just the count'
    }[count];
    return { notes: [{ title: N[0], body: N[1], when: '9:00' }], caption: caption };
  }
}
</script>
</body>
</html>
