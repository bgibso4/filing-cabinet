name: FilingCabinet
options:
  bundleIdPrefix: com.cadre
  deploymentTarget:
    iOS: "27.0"
  xcodeVersion: "27.1"
  createIntermediateGroups: true

# DEVELOPMENT_TEAM and APP_BUNDLE_ID come from Signing.xcconfig (which optionally includes a
# gitignored Signing.local.xcconfig). Never set them in `settings` below: target settings
# outrank an xcconfig and would silently defeat the override.
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig

settings:
  base:
    SWIFT_VERSION: "6"
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # One version for the app and its extension: an embedded extension must match the app's.
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: 1

packages:
  FilingCabinetKit:
    path: Packages/FilingCabinetKit
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    exactVersion: 1.19.7

targets:
  FilingCabinet:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "**/.DS_Store"
      # The App Intents, compiled into the app and the controls extension (Plan 6 E1).
      - path: Intents
        excludes:
          - "**/.DS_Store"
    dependencies:
      - target: FilingCabinetControls
        embed: true
      - package: FilingCabinetKit
        product: Core
      - package: FilingCabinetKit
        product: Understanding
      - package: FilingCabinetKit
        product: Library
      - package: FilingCabinetKit
        product: ScreenModels
      - package: FilingCabinetKit
        product: Screens
      # Test doubles for the launch flags; the app uses them only under `#if DEBUG` (M9). Built, but linked by Debug
      # alone (OTHER_LDFLAGS below): Xcode links a package product's object whole, so Release would carry the fakes.
      - package: FilingCabinetKit
        product: TestSupport
        link: false
    settings:
      configs:
        Debug:
          OTHER_LDFLAGS: $(inherited) $(BUILT_PRODUCTS_DIR)/TestSupport.o
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        PRODUCT_NAME: FilingCabinet
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        # App/AppIcon.icon, built from design/app-icon/layers: flat (glass, shadow, specular and translucency off).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        # iPhone only, portrait only (Info.plist lists the single orientation).
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic

  # The Scan control (Control Center, Lock Screen, Action button). Links Core only: its intent runs in the app.
  FilingCabinetControls:
    type: app-extension
    platform: iOS
    sources:
      - path: Controls
        excludes:
          - "**/.DS_Store"
      - path: Intents
        excludes:
          - "**/.DS_Store"
    dependencies:
      - package: FilingCabinetKit
        product: Core
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).controls
        PRODUCT_NAME: FilingCabinetControls
        INFOPLIST_FILE: Controls/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES

  # App-hosted: snapshots use drawHierarchyInKeyWindow, which needs the real app's key window.
  FilingCabinetSnapshotTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SnapshotTests
        excludes:
          - "**/.DS_Store"
          - "**/__Snapshots__/**"
      # The fixtures' sample scans (synthetic, from the design prototype).
      - path: design/prototype/scans
        includes: ["*.jpg"]
        buildPhase: resources
    dependencies:
      # Screens and ScreenModels come from the host app (TEST_HOST): linking them again would build the
      # package products as dynamic frameworks and break the unhosted package tests' resource bundles.
      - target: FilingCabinet
      - package: SnapshotTesting
        product: SnapshotTesting
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).snapshottests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/FilingCabinet.app/FilingCabinet
        BUNDLE_LOADER: $(TEST_HOST)
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic

  # Runs out of process against the installed app. Core is linked for AccessibilityID, ScreenModels for
  # CollectionText.name (a grid header's title); no host.
  FilingCabinetUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
        excludes:
          - "**/.DS_Store"
    dependencies:
      - target: FilingCabinet
      - package: FilingCabinetKit
        product: Core
      - package: FilingCabinetKit
        product: ScreenModels
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).uitests
        TEST_TARGET_NAME: FilingCabinet
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic

  # App-hosted timing on a real iPhone (A12, A14): `make device-perf` only, never `make full` or CI.
  # Understanding comes from the host app (TEST_HOST), as Screens does for the snapshot tests.
  FilingCabinetDeviceTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DeviceTests
        excludes:
          - "**/.DS_Store"
      - path: design/prototype/scans/scan-r-pharmacy.jpg
        buildPhase: resources
      - path: design/prototype/scans/scan-lease.jpg
        buildPhase: resources
      - path: design/prototype/scans/scan-lease-p2.jpg
        buildPhase: resources
      - path: design/prototype/scans/scan-note-bio.jpg
        buildPhase: resources
      - path: design/prototype/scans/scan-insurance.jpg
        buildPhase: resources
    dependencies:
      - target: FilingCabinet
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).devicetests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/FilingCabinet.app/FilingCabinet
        BUNDLE_LOADER: $(TEST_HOST)
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic

# Empty aggregate: a scheme needs one build target from this project, and Fast must not
# build the app. The package tests it runs come from the scheme's test targets.
aggregateTargets:
  FastTests:
    targets: []

# Hand-written schemes; XcodeGen's auto-generated ones are off so these are the only ones.
schemes:
  FilingCabinet:
    build:
      targets:
        FilingCabinet: all
    run:
      config: Debug
    test:
      config: Debug
      # Everything, on the simulator. Package test targets are added here as they appear.
      targets:
        - package: FilingCabinetKit/CoreTests
        - package: FilingCabinetKit/UnderstandingTests
        - package: FilingCabinetKit/LibraryTests
        - package: FilingCabinetKit/ScreenModelsTests
        - package: FilingCabinetKit/ScreensTests
        - name: FilingCabinetSnapshotTests
        - name: FilingCabinetUITests

  # Mac-only loop: no app target, no simulator.
  Fast:
    build:
      targets:
        FastTests: [test]
    test:
      config: Debug
      targets:
        - package: FilingCabinetKit/CoreTests
        - package: FilingCabinetKit/UnderstandingTests
        - package: FilingCabinetKit/LibraryTests
        - package: FilingCabinetKit/ScreenModelsTests
        - package: FilingCabinetKit/SuggestionEvaluationTests

  # The reader bake-off report (A12) on macOS: `make compare-readers`. Not in Fast or FilingCabinet.
  ReaderComparison:
    build:
      targets:
        FastTests: [test]
    test:
      config: Debug
      targets:
        - package: FilingCabinetKit/ReaderComparisonTests

  # The suggestion evaluation report (Plan 5) on macOS: `make eval-suggestions`. Not in FilingCabinet or CI. The
  # target's file and scoring tests also run in Fast; the model run needs FC_EVAL_SUGGESTIONS, which only this sets.
  SuggestionEvaluation:
    build:
      targets:
        FastTests: [test]
    test:
      config: Debug
      environmentVariables:
        FC_EVAL_SUGGESTIONS: "1"
      targets:
        - package: FilingCabinetKit/SuggestionEvaluationTests

  # Reader timing on a connected iPhone: `make device-perf DEVICE=<name>`. Not in FilingCabinet or CI.
  Device:
    build:
      targets:
        FilingCabinet: all
        FilingCabinetDeviceTests: [test]
    test:
      config: Debug
      targets:
        - name: FilingCabinetDeviceTests
